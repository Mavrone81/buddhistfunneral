name: Deploy to DigitalOcean

# Redeploys the live site whenever code is pushed to main.
# Requires repo secrets: DO_HOST, DO_USER, DO_SSH_KEY (see README / setup notes).
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false # never interrupt a deploy mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script_stop: true # abort on the first failing command
          script: |
            set -euo pipefail
            echo "→ Updating code"
            cd /root/buddhistfunneral
            git fetch origin main
            git reset --hard origin/main           # code only; content.json/uploads are git-ignored & untouched

            echo "→ Installing dependencies"
            cd buddhist-funeral-website
            npm ci --omit=dev

            echo "→ Reloading app"
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
            echo "✓ Deploy complete"
